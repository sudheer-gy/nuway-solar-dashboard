name: Fetch Solar Data Every 10 Minutes

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  fetch-solar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Phase 2 eGauge data (egauge100391 - egauge.io)
        run: |
          echo "Fetching Phase 2 solar data..."
          # Try with digest auth first (eGauge default)
          curl -s --max-time 30 --retry 3 --retry-delay 5 \
            --digest -u "owner:" \
            "https://egauge100391.egauge.io/cgi-bin/egauge-show?m&n=5760&C" \
            -H "Accept: text/xml" \
            -o egauge_p2_raw.xml
          P2_SIZE=$(wc -c < egauge_p2_raw.xml 2>/dev/null || echo 0)
          echo "Phase 2 file size: ${P2_SIZE} bytes"
          # Check if we got valid XML (not a login page)
          if grep -q "<data" egauge_p2_raw.xml 2>/dev/null; then
            echo "Phase 2: Valid XML received"
          else
            echo "Phase 2: Auth may be required - trying without auth"
            curl -s --max-time 30 --retry 2 \
              "https://egauge100391.egauge.io/cgi-bin/egauge-show?m&n=5760&C" \
              -H "Accept: text/xml" \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              -o egauge_p2_raw.xml || true
            if grep -q "<data" egauge_p2_raw.xml 2>/dev/null; then
              echo "Phase 2: Got valid XML on retry"
            else
              echo "Phase 2: Still no valid XML - first 200 chars:"
              head -c 200 egauge_p2_raw.xml || true
            fi
          fi

      - name: Fetch Phase 1 eGauge data (egauge52389 - egaug.es)
        run: |
          echo "Fetching Phase 1 solar data..."
          curl -s --max-time 30 --retry 3 --retry-delay 5 \
            "https://egauge52389.egaug.es/cgi-bin/egauge-show?m&n=5760&C" \
            -H "Accept: text/xml" \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
            -o egauge_p1_raw.xml || true
          P1_SIZE=$(wc -c < egauge_p1_raw.xml 2>/dev/null || echo 0)
          echo "Phase 1 file size: ${P1_SIZE} bytes"
          if grep -q "<data" egauge_p1_raw.xml 2>/dev/null; then
            echo "Phase 1: Valid XML received"
          else
            echo "Phase 1: No valid XML - first 200 chars:"
            head -c 200 egauge_p1_raw.xml || true
          fi

      - name: Process and save solar data
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict
          import json, os

          def process_egauge(filename, phase, device):
              outfile = f'solar_p{phase}_data.json' if phase == 1 else 'solar_data.json'

              if not os.path.exists(filename):
                  print(f"Phase {phase}: raw file missing, skipping")
                  return False

              file_size = os.path.getsize(filename)
              if file_size < 100:
                  print(f"Phase {phase}: file too small ({file_size} bytes) - likely auth error, skipping")
                  with open(filename, 'r', errors='replace') as f:
                      print(f"  Content: {f.read(200)}")
                  return False

              try:
                  with open(filename, 'r', errors='replace') as f:
                      raw = f.read(500)
                  if '<data' not in raw and '<group' not in raw:
                      print(f"Phase {phase}: no XML data element found. Content preview: {raw[:200]}")
                      return False

                  tree = ET.parse(filename)
                  root = tree.getroot()
                  data = root.find('data')
                  if data is None:
                      print(f"Phase {phase}: no data element found")
                      return False

                  time_stamp = int(data.get('time_stamp'), 16)
                  time_delta = int(data.get('time_delta'))
                  values = [int(r.find('c').text) for r in data.findall('r')]

                  if len(values) < 2:
                      print(f"Phase {phase}: insufficient data rows ({len(values)})")
                      return False

                  lifetime_kwh = round(values[0] / 3600000, 1)
                  deltas = values[1:]

                  base_et = datetime.fromtimestamp(time_stamp, tz=timezone.utc) - timedelta(hours=4)
                  today = base_et.strftime('%Y-%m-%d')
                  yesterday = (base_et - timedelta(days=1)).strftime('%Y-%m-%d')

                  hourly = []
                  for i in range(0, len(deltas), 60):
                      chunk = deltas[i:i+60]
                      kwh = round(sum(abs(v) for v in chunk) / 3600000, 2)
                      t = base_et - timedelta(hours=i//60)
                      # Use ISO format with T separator for reliable JS Date parsing
                      hourly.append({'time': t.strftime('%Y-%m-%dT%H:%M'), 'kwh': kwh})
                  hourly.reverse()

                  today_kwh = round(sum(h['kwh'] for h in hourly if h['time'].startswith(today)), 2)
                  yest_kwh  = round(sum(h['kwh'] for h in hourly if h['time'].startswith(yesterday)), 2)
                  current   = hourly[-1]['kwh'] if hourly else 0

                  monthly = defaultdict(float)
                  for h in hourly:
                      monthly[h['time'][:7]] += h['kwh']

                  # Compute daily totals from all hourly data
                  daily = {}
                  for h in hourly:
                      date = h['time'][:10]  # "2026-06-22"
                      daily[date] = round((daily.get(date, 0) + h['kwh']), 2)

                  output = {
                      'updated_at': base_et.strftime('%Y-%m-%d %H:%M ET'),
                      'device': device,
                      'phase': phase,
                      'lifetime_kwh': lifetime_kwh,
                      'today_kwh': today_kwh,
                      'yesterday_kwh': yest_kwh,
                      'current_kwh': current,
                      'hourly_last_48': hourly[-48:],
                      'daily_last_4': daily,
                      'monthly': {k: round(v, 1) for k, v in monthly.items()}
                  }

                  with open(outfile, 'w') as f:
                      json.dump(output, f, indent=2)

                  print(f"Phase {phase} ({device}) - SUCCESS")
                  print(f"  Lifetime: {lifetime_kwh:,} kWh")
                  print(f"  Today:    {today_kwh} kWh")
                  print(f"  Yesterday:{yest_kwh} kWh")
                  print(f"  Current:  {current} kWh")
                  print(f"  Hourly entries: {len(hourly)}")
                  print(f"  Saved: {outfile}")
                  return True

              except Exception as e:
                  import traceback
                  print(f"Phase {phase} error: {e}")
                  traceback.print_exc()
                  return False

          ok2 = process_egauge('egauge_p2_raw.xml', 2, 'egauge100391.egauge.io')
          ok1 = process_egauge('egauge_p1_raw.xml', 1, 'egauge52389.egaug.es')
          print(f"\nSummary: Phase1={'OK' if ok1 else 'FAILED'}, Phase2={'OK' if ok2 else 'FAILED'}")
          PYEOF

      - name: Commit and push JSON files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add solar_data.json solar_p1_data.json || true
          git diff --staged --quiet || git commit -m "⚡ Auto-update solar data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
