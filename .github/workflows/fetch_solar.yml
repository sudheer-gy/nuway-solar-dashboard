name: Fetch Solar Data Hourly

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  fetch-solar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Fetch Phase 2 eGauge data
        run: |
          echo "Fetching Phase 2 solar data..."
          curl -s --max-time 30 --retry 3 --retry-delay 5 \
            "https://egauge100391.egauge.io/cgi-bin/egauge-show?m&n=2880&C" \
            -H "Accept: text/xml" \
            -o egauge_p2_raw.xml || echo "Phase 2 fetch failed, will use existing data"
          if [ -f egauge_p2_raw.xml ]; then
            echo "Phase 2 file size: $(wc -c < egauge_p2_raw.xml) bytes"
          fi

      - name: Fetch Phase 1 eGauge data
        run: |
          echo "Fetching Phase 1 solar data..."
          curl -s --max-time 30 --retry 3 --retry-delay 5 \
            "https://egauge52389.egaug.es/cgi-bin/egauge-show?m&n=2880&C" \
            -H "Accept: text/xml" \
            -o egauge_p1_raw.xml || echo "Phase 1 fetch failed, will use existing data"
          if [ -f egauge_p1_raw.xml ]; then
            echo "Phase 1 file size: $(wc -c < egauge_p1_raw.xml) bytes"
          fi

      - name: Process and save solar data
        run: |
          python3 << 'PYEOF'
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone, timedelta
          from collections import defaultdict
          import json, os

          def process_egauge(filename, phase, device):
              outfile = f'solar_p{phase}_data.json' if phase == 1 else 'solar_data.json'

              if not os.path.exists(filename):
                  print(f"Phase {phase}: raw file missing, skipping")
                  return

              try:
                  tree = ET.parse(filename)
                  root = tree.getroot()
                  data = root.find('data')
                  if data is None:
                      print(f"Phase {phase}: no data element found")
                      return

                  time_stamp = int(data.get('time_stamp'), 16)
                  time_delta = int(data.get('time_delta'))
                  values = [int(r.find('c').text) for r in data.findall('r')]

                  lifetime_kwh = round(values[0] / 3600000, 1)
                  deltas = values[1:]

                  base_et = datetime.fromtimestamp(time_stamp, tz=timezone.utc) - timedelta(hours=4)
                  today = base_et.strftime('%Y-%m-%d')
                  yesterday = (base_et - timedelta(days=1)).strftime('%Y-%m-%d')

                  hourly = []
                  for i in range(0, len(deltas), 60):
                      chunk = deltas[i:i+60]
                      kwh = round(sum(abs(v) for v in chunk) / 3600000, 2)
                      t = base_et - timedelta(hours=i//60)
                      hourly.append({'time': t.strftime('%Y-%m-%d %H:%M'), 'kwh': kwh})
                  hourly.reverse()

                  today_kwh = round(sum(h['kwh'] for h in hourly if h['time'].startswith(today)), 2)
                  yest_kwh  = round(sum(h['kwh'] for h in hourly if h['time'].startswith(yesterday)), 2)
                  current   = hourly[-1]['kwh'] if hourly else 0

                  monthly = defaultdict(float)
                  for h in hourly:
                      monthly[h['time'][:7]] += h['kwh']

                  output = {
                      'updated_at': base_et.strftime('%Y-%m-%d %H:%M ET'),
                      'device': device,
                      'phase': phase,
                      'lifetime_kwh': lifetime_kwh,
                      'today_kwh': today_kwh,
                      'yesterday_kwh': yest_kwh,
                      'current_kwh': current,
                      'hourly_last_48': hourly,
                      'monthly': {k: round(v, 1) for k, v in monthly.items()}
                  }

                  with open(outfile, 'w') as f:
                      json.dump(output, f, indent=2)

                  print(f"Phase {phase} ({device})")
                  print(f"  Lifetime: {lifetime_kwh:,} kWh")
                  print(f"  Today:    {today_kwh} kWh")
                  print(f"  Yesterday:{yest_kwh} kWh")
                  print(f"  Saved:    {outfile}")

              except Exception as e:
                  print(f"Phase {phase} error: {e}")

          process_egauge('egauge_p2_raw.xml', 2, 'egauge100391.egauge.io')
          process_egauge('egauge_p1_raw.xml', 1, 'egauge52389.egaug.es')
          PYEOF

      - name: Commit and push JSON files
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add solar_data.json solar_p1_data.json || true
          git diff --staged --quiet || git commit -m "⚡ Auto-update solar data $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
